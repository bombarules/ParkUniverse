<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aquatics Tech</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141a2b;--mut:#5b6478;--line:#e3e7f0;--acc:#5a48e8;--fb:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:Unbounded,Manrope,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:400 16px/1.45 var(--fb);color:var(--ink);background:linear-gradient(165deg,#d9d9f4 0%,#e7ebf6 34%,#eef1f6 100%) fixed;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(36px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:10px}
.nav button{font:600 1.15rem/1 var(--fb);color:var(--acc);background:none;border:0;padding:10px 0;cursor:pointer}
h1{font:500 clamp(1.6rem,7.2vw,2.4rem)/1.12 var(--fd);letter-spacing:-.02em;margin:6px 0 24px;text-align:center}
.list{background:#fff;border-radius:28px;box-shadow:0 12px 34px rgba(70,70,140,.12);overflow:hidden}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:84px;padding:18px 22px;border:0;border-top:1px solid var(--line);background:#fff;color:inherit;text-align:left;font:inherit;cursor:pointer}
.row:first-child{border-top:0}.row:active{background:#f3f4fb}
.e{font-size:2rem;line-height:1;flex:none;width:2.2rem;text-align:center}
.tx{flex:1;min-width:0}.t{font:600 1.35rem/1.2 var(--fb);display:block}.d{display:block;color:var(--mut);font-size:.95rem;margin-top:3px}
.cnt{color:var(--mut);font-size:1.3rem}
.chev{width:10px;height:10px;border-right:2.5px solid #2a3047;border-bottom:2.5px solid #2a3047;transform:rotate(-45deg);margin:0 6px 0 4px;flex:none}
.empty{padding:34px 24px;text-align:center;color:var(--mut);font-size:1.05rem}
.foot{color:var(--mut);text-align:center;font-size:.85rem;margin-top:22px}
#vw{position:fixed;inset:0;z-index:50;display:none;background:#0d1218}
#vw iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0d1218}
#bk2{position:fixed;left:6px;top:50%;z-index:60;display:none;width:42px;height:42px;padding:0;border:1px solid rgba(255,255,255,.25);background:rgba(27,34,43,.55);color:#e8edf3;border-radius:50%;font:600 26px/1 var(--fb);box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;touch-action:none;opacity:.7;transition:opacity .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#bk2:active,#bk2:focus-visible{opacity:1}
#bk2:focus-visible{outline:2px solid #6cb4ff;outline-offset:2px}
#fb{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:61;display:none;background:#fff3cd;color:#111;border:2px solid #e5532d;border-radius:12px;padding:10px 12px;font:13.5px var(--fb)}
#fb a{color:#1a4fc4;font-weight:700}
</style></head><body><div class="wrap" id="app"></div>
<div id="vw"><iframe id="fr" title="Model"></iframe></div>
<button id="bk2" aria-label="Back" title="Back (drag to move)" type="button">&#8249;</button><div id="fb"></div>
<script>
var PAGES={"emu": "pool-plant/emulator.html", "plant": "aquatics/plant.html", "pj_boiler": "aquatics/pj_boiler.html", "pj_hot": "aquatics/pj_hot.html", "rw_boiler": "aquatics/rw_boiler.html", "rw_heater": "aquatics/rw_heater.html"};
var LINKS={"emu": "https://claude.ai/artifact/F8ibULmiUyUhUh5dqiXiNL", "plant": "https://claude.ai/artifact/LJLqzUWV5aoErrv19YSfn5", "pj_boiler": "https://claude.ai/artifact/34AYnTi1mXRDQ6Gn6Lkib7", "pj_hot": "https://claude.ai/artifact/MecWdKLcHVjBvA6d3gVq2B", "rw_boiler": "https://claude.ai/artifact/9bTx5CmyXPWwqp2m5ykbfN", "rw_heater": "https://claude.ai/artifact/VMsw8CcoozmtyqdNH8qvGX"};
// seven pools; each project opens inside this page
var POOLS=[
 {id:'splash',n:'Splash Landing',items:[
  {t:'Heating Plant Emulator',d:'Simulate pump, heater and pool temperature',i:'\uD83C\uDF21\uFE0F',k:'emu'},
  {t:'Boiler Room',d:'Heater, filters and pumps. Simulate, take apart, video tour',i:'\uD83D\uDD25',k:'plant'}]},
 {id:'aviator',n:'Aviator',items:[]},
 {id:'f15',n:'F-15',items:[]},
 {id:'jet',n:'Jet Stream',items:[]},
 {id:'puddle',n:'Puddle Jumper',items:[
  {t:'Boiler Room',d:'Outdoor yard: heater, filters and pumps',i:'\uD83D\uDD25',k:'pj_boiler'},
  {t:'Hot Water Heater Room',d:'Chemical wall, valves and water heater',i:'\uD83D\uDEBF',k:'pj_hot'}]},
 {id:'maverick',n:'Maverick',items:[]},
 {id:'runway',n:'Runway 35',items:[
  {t:'Boiler Room',d:'Outdoor yard: heater, filters, pumps and chemical board',i:'\uD83D\uDD25',k:'rw_boiler'},
  {t:'Heater Room',d:'Controls, electrical, water heater and piping',i:'\uD83D\uDEBF',k:'rw_heater'}]}];
var app=document.getElementById('app'),vw=document.getElementById('vw'),fr=document.getElementById('fr'),bk2=document.getElementById('bk2'),fb=document.getElementById('fb'),timer=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function home(){
 app.innerHTML='<h1>Aquatics Tech</h1><div class="list">'+POOLS.map(function(p){return '<button class="row" data-id="'+p.id+'"><span class="e" aria-hidden="true">\uD83D\uDCA7</span><span class="tx"><span class="t">'+esc(p.n)+'</span></span><span class="cnt">'+p.items.length+'</span><span class="chev" aria-hidden="true"></span></button>'}).join('')+'</div><p class="foot">Aquatics Tech &middot; web app</p>';
 [].forEach.call(app.querySelectorAll('.row'),function(b){b.onclick=function(){location.hash='#/'+b.getAttribute('data-id')}});
}
function pool(p){
 app.innerHTML='<div class="nav"><button id="bk">\u2039 Pools</button></div><h1>'+esc(p.n)+'</h1>'+
  (p.items.length?'<div class="list">'+p.items.map(function(x,i){return '<button class="row" data-k="'+x.k+'"><span class="e" aria-hidden="true">'+x.i+'</span><span class="tx"><span class="t">'+esc(x.t)+'</span><span class="d">'+esc(x.d)+'</span></span><span class="chev" aria-hidden="true"></span></button>'}).join('')+'</div>':'<div class="list"><div class="empty">Nothing added to '+esc(p.n)+' yet.</div></div>');
 document.getElementById('bk').onclick=function(){location.hash='#/'};
 [].forEach.call(app.querySelectorAll('.row'),function(b){b.onclick=function(){openProject(b.getAttribute('data-k'))}});
}
function openProject(k){
 vw.style.display='block';bk2.style.display='block';if(!bkPushed){try{history.pushState({aqv:1},'');bkPushed=true}catch(e){}}fb.style.display='none';
 fr.onload=function(){if(fr.getAttribute('src')&&fr.getAttribute('src')!=='about:blank'){clearTimeout(timer);fb.style.display='none'}};fr.src=PAGES[k];
 clearTimeout(timer);timer=setTimeout(function(){fb.innerHTML='This page could not open inside the app page here. Open it on its own: <a href="'+LINKS[k]+'" target="_blank" rel="noopener">open '+esc(k)+'</a>';fb.style.display='block'},12000);
}
function closeProject(){clearTimeout(timer);fb.style.display='none';vw.style.display='none';bk2.style.display='none';fr.removeAttribute('srcdoc');fr.src='about:blank'}
addEventListener('message',function(e){if(e.data&&e.data.aq==='ready'){clearTimeout(timer);fb.style.display='none'}});
var bkPushed=false;addEventListener('popstate',function(){if(bkPushed){bkPushed=false;closeProject()}});(function(){var sy=0,st=0,mv=false;try{var t=localStorage.getItem('aq-bk-top');if(t)bk2.style.top=t}catch(e){}bk2.addEventListener('pointerdown',function(e){mv=false;sy=e.clientY;st=bk2.getBoundingClientRect().top;bk2.setPointerCapture(e.pointerId)});bk2.addEventListener('pointermove',function(e){if(!bk2.hasPointerCapture(e.pointerId))return;var d=e.clientY-sy;if(Math.abs(d)>6)mv=true;if(mv){var y=Math.max(8,Math.min(innerHeight-50,st+d));bk2.style.top=y+'px'}});bk2.addEventListener('pointerup',function(){if(mv){try{localStorage.setItem('aq-bk-top',bk2.style.top)}catch(e){}}});bk2.onclick=function(e){if(mv){mv=false;e.preventDefault();return}if(bkPushed)history.back();else closeProject()};})();
function route(){
 var id=(location.hash.match(/^#\/(\w+)/)||[])[1],p=POOLS.filter(function(x){return x.id===id})[0];
 if(p)pool(p);else home();window.scrollTo(0,0);
}
addEventListener('hashchange',function(){closeProject();route()});route();
</script></body></html>
